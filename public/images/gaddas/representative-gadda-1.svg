<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#FAF8F4"/>
  <!-- Traditional Quilted Gadda representation -->
  <rect x="60" y="80" width="480" height="220" rx="16" fill="#F3EFE7" stroke="#D9CCB6" stroke-width="2"/>
  <!-- Stitch Tufting Grid -->
  <g fill="#D9CCB6" stroke="#22231F" stroke-opacity="0.3">
    <circle cx="120" cy="130" r="4"/><circle cx="210" cy="130" r="4"/><circle cx="300" cy="130" r="4"/><circle cx="390" cy="130" r="4"/><circle cx="480" cy="130" r="4"/>
    <circle cx="120" cy="190" r="4"/><circle cx="210" cy="190" r="4"/><circle cx="300" cy="190" r="4"/><circle cx="390" cy="190" r="4"/><circle cx="480" cy="190" r="4"/>
    <circle cx="120" cy="250" r="4"/><circle cx="210" cy="250" r="4"/><circle cx="300" cy="250" r="4"/><circle cx="390" cy="250" r="4"/><circle cx="480" cy="250" r="4"/>
  </g>
  <!-- Quilt Border Piping -->
  <rect x="75" y="95" width="450" height="190" rx="10" fill="none" stroke="#BF4D28" stroke-width="1.5" stroke-dasharray="8,6"/>
  <!-- Label Badge -->
  <rect x="60" y="325" width="480" height="36" rx="18" fill="#22231F" opacity="0.85"/>
  <text x="300" y="347" fill="#FAF8F4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    REPRESENTATIVE SEASONAL GADDA PLACEHOLDER • PRINTS VARY BY BATCH
  </text>
</svg>
