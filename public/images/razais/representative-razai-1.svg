<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#FAF8F4"/>
  <!-- Traditional Quilted Razai Representation -->
  <g transform="translate(80, 75)">
    <!-- Main Folded Quilt Layer -->
    <path d="M 40,30 L 400,30 Q 430,30 430,60 L 430,220 Q 430,240 400,240 L 40,240 Q 10,240 10,220 L 10,60 Q 10,30 40,30 Z" fill="#F3EFE7" stroke="#D9CCB6" stroke-width="2"/>
    <!-- Fold Roll Top -->
    <path d="M 40,30 Q 220,15 400,30 L 410,90 Q 220,75 30,90 Z" fill="#E5DCCE" stroke="#D9CCB6" stroke-width="1.5"/>
    <!-- Decorative Seasonal Printed Motif (Diamond Quilt lines) -->
    <path d="M 40,110 L 100,160 L 40,210" fill="none" stroke="#BF4D28" stroke-width="2" opacity="0.6"/>
    <path d="M 120,110 L 180,160 L 120,210" fill="none" stroke="#BF4D28" stroke-width="2" opacity="0.6"/>
    <path d="M 200,110 L 260,160 L 200,210" fill="none" stroke="#BF4D28" stroke-width="2" opacity="0.6"/>
    <path d="M 280,110 L 340,160 L 280,210" fill="none" stroke="#BF4D28" stroke-width="2" opacity="0.6"/>
    <path d="M 360,110 L 420,160 L 360,210" fill="none" stroke="#BF4D28" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- Label Badge -->
  <rect x="60" y="325" width="480" height="36" rx="18" fill="#22231F" opacity="0.85"/>
  <text x="300" y="347" fill="#FAF8F4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    REPRESENTATIVE SEASONAL RAZAI PLACEHOLDER • PRINTS VARY BY BATCH
  </text>
</svg>
