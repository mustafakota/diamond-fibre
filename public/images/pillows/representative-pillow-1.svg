<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#FAF8F4"/>
  <!-- Bedding Pillow Representation -->
  <g transform="translate(100, 90)">
    <!-- Back Pillow -->
    <rect x="70" y="20" width="280" height="150" rx="36" fill="#F3EFE7" stroke="#D9CCB6" stroke-width="2"/>
    <!-- Front Pillow -->
    <rect x="30" y="60" width="320" height="160" rx="40" fill="#FFFFFF" stroke="#D9CCB6" stroke-width="2" filter="drop-shadow(0 8px 12px rgba(34,35,31,0.06))"/>
    <!-- Pillow Flange/Piping seam -->
    <rect x="44" y="74" width="292" height="132" rx="30" fill="none" stroke="#E5DCCE" stroke-width="1.5"/>
    <!-- Gentle indent curve -->
    <path d="M 120,140 Q 190,155 260,140" fill="none" stroke="#F3EFE7" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Label Badge -->
  <rect x="60" y="325" width="480" height="36" rx="18" fill="#22231F" opacity="0.85"/>
  <text x="300" y="347" fill="#FAF8F4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    REPRESENTATIVE PILLOW PLACEHOLDER • OPTIONS CONFIRMED ON ENQUIRY
  </text>
</svg>
