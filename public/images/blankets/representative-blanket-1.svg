<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#FAF8F4"/>
  <!-- Folded Bedding Blanket Representation -->
  <g transform="translate(100, 80)">
    <!-- Stack Layer 1 (Bottom) -->
    <rect x="20" y="140" width="360" height="70" rx="16" fill="#D9CCB6" stroke="#C7B69B" stroke-width="2"/>
    <!-- Stack Layer 2 (Middle) -->
    <rect x="35" y="85" width="330" height="65" rx="16" fill="#F3EFE7" stroke="#D9CCB6" stroke-width="2"/>
    <!-- Stack Layer 3 (Top Fold) -->
    <rect x="50" y="30" width="300" height="65" rx="16" fill="#FFFFFF" stroke="#D9CCB6" stroke-width="2"/>
    <!-- Woven Stitch Texture (Top) -->
    <line x1="70" y1="62" x2="330" y2="62" stroke="#BF4D28" stroke-width="2" stroke-dasharray="8,6"/>
    <line x1="55" y1="117" x2="345" y2="117" stroke="#22231F" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6,6"/>
  </g>
  <!-- Label Badge -->
  <rect x="60" y="325" width="480" height="36" rx="18" fill="#22231F" opacity="0.85"/>
  <text x="300" y="347" fill="#FAF8F4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    REPRESENTATIVE BLANKET PLACEHOLDER • WEAVES &amp; COLORS VARY BY BATCH
  </text>
</svg>
