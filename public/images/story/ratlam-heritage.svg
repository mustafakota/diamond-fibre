<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#FAF8F4"/>
  <!-- Ratlam Manufacturing Heritage Visual Representation -->
  <g transform="translate(60, 50)">
    <!-- Facility outline frame -->
    <rect x="0" y="0" width="480" height="250" rx="20" fill="#F3EFE7" stroke="#D9CCB6" stroke-width="2"/>
    <!-- Central Iconography of 4 Confirmed Disciplines -->
    <g transform="translate(40, 50)">
      <!-- 1. Stitching -->
      <rect x="10" y="20" width="80" height="80" rx="12" fill="#FFFFFF" stroke="#D9CCB6" stroke-width="1.5"/>
      <text x="50" y="65" fill="#BF4D28" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle">✂</text>
      <text x="50" y="125" fill="#22231F" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">STITCHING</text>
      
      <!-- 2. Filling -->
      <rect x="110" y="20" width="80" height="80" rx="12" fill="#FFFFFF" stroke="#D9CCB6" stroke-width="1.5"/>
      <text x="150" y="65" fill="#BF4D28" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle">☁</text>
      <text x="150" y="125" fill="#22231F" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">FILLING</text>

      <!-- 3. Quilting -->
      <rect x="210" y="20" width="80" height="80" rx="12" fill="#FFFFFF" stroke="#D9CCB6" stroke-width="1.5"/>
      <text x="250" y="65" fill="#BF4D28" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle">◈</text>
      <text x="250" y="125" fill="#22231F" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">QUILTING</text>

      <!-- 4. Packing -->
      <rect x="310" y="20" width="80" height="80" rx="12" fill="#FFFFFF" stroke="#D9CCB6" stroke-width="1.5"/>
      <text x="350" y="65" fill="#BF4D28" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle">✔</text>
      <text x="350" y="125" fill="#22231F" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">PACKING</text>
    </g>
  </g>
  <!-- Label Badge -->
  <rect x="60" y="325" width="480" height="36" rx="18" fill="#22231F" opacity="0.85"/>
  <text x="300" y="347" fill="#FAF8F4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    RATLAM FACILITY CAPABILITIES (EST. 2018) • PENDING APPROVED PUBLIC PHOTOS
  </text>
</svg>
