<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#FAF8F4"/>
  <!-- Modern Structured Bed Mattress Representation -->
  <g transform="translate(60, 90)">
    <!-- 3D Perspective Isometric Mattress Slab -->
    <!-- Top Surface -->
    <polygon points="240,10 470,60 230,130 0,80" fill="#FFFFFF" stroke="#D9CCB6" stroke-width="2"/>
    <!-- Top Quilted Texture lines -->
    <line x1="60" y1="92" x2="300" y2="22" stroke="#F3EFE7" stroke-width="2"/>
    <line x1="120" y1="105" x2="360" y2="35" stroke="#F3EFE7" stroke-width="2"/>
    <line x1="180" y1="118" x2="420" y2="48" stroke="#F3EFE7" stroke-width="2"/>
    <!-- Left Side Border Band -->
    <polygon points="0,80 230,130 230,180 0,130" fill="#F3EFE7" stroke="#D9CCB6" stroke-width="2"/>
    <line x1="0" y1="105" x2="230" y2="155" stroke="#BF4D28" stroke-width="2"/>
    <!-- Right Side Border Band -->
    <polygon points="230,130 470,60 470,110 230,180" fill="#E5DCCE" stroke="#D9CCB6" stroke-width="2"/>
    <line x1="230" y1="155" x2="470" y2="85" stroke="#BF4D28" stroke-width="2"/>
  </g>
  <!-- Label Badge -->
  <rect x="60" y="325" width="480" height="36" rx="18" fill="#22231F" opacity="0.85"/>
  <text x="300" y="347" fill="#FAF8F4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    REPRESENTATIVE MATTRESS MODEL PLACEHOLDER • SIZES: 3x6, 4x6, 6x6 FT
  </text>
</svg>
